{% comment %}
  Shows Django messages as Bootstrap alerts (UI-07).
  settings.py maps messages.ERROR to 'danger', so message.tags is a valid Bootstrap colour:
  success, info, warning, danger.
{% endcomment %}
{% if messages %}
  <div class="container mt-3" id="message-area">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
