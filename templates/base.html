<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FAST CARS</title></head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="{% url 'home' %}">Home</a>
      <a href="{% url 'vehicles:list' %}">Cars</a>
      <a href="{% url 'contact:contact' %}">Contact us</a>
      {% if user.is_authenticated %}
        <a href="{% url 'accounts:profile' %}">My account</a>
        <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
          {% csrf_token %}<button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:login' %}">Log in</a>
        <a href="{% url 'accounts:register' %}">Register</a>
      {% endif %}
    </nav>
  </header>
  {% for message in messages %}
    <p class="{{ message.tags }}">{{ message }}</p>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
